[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-triage"
version = "0.1.0"
requires-python = ">=3.11"

# setuptools auto-discovers any directory with __init__.py (src/, app/).
# This makes `from src.schemas import Digest` work on Streamlit Cloud
# without sys.path manipulation — pip installs the repo root as a package
# when requirements.txt contains `-e .`.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes.
select = ["E", "W", "F"]
ignore = [
    "E501",  # line too long (prompt strings exceed 100 chars by design)
    "E402",  # module level import not at top (all scripts do sys.path.insert before imports)
]
